name: Independent Store Ops Real Crawl

on:
  push:
    paths:
      - 'independent-store-operations/validation/real_network/**'
      - '.github/workflows/independent-store-ops-real-crawl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Scrapy==2.19.0'

      - name: Run bounded public-site crawl
        run: |
          python independent-store-operations/validation/real_network/crawl_gold.py

      - name: Show calibration report
        if: always()
        run: |
          cat independent-store-operations/validation/real_network/results/report.json || true

      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-store-ops-real-crawl
          path: independent-store-operations/validation/real_network/results/
          if-no-files-found: warn
          retention-days: 14
