name: Independent Store Ops Real Crawl

on:
  push:
    paths:
      - 'independent-store-operations/validation/real_network/**'
      - 'independent-store-operations/validation/g2_security/**'
      - '.github/workflows/independent-store-ops-real-crawl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Scrapy==2.19.0' 'playwright>=1.55,<2'
          python -m playwright install chromium

      - name: Prepare evidence directory
        run: |
          mkdir -p independent-store-operations/validation/real_network/results

      - name: Prove Scrapy connection-time DNS pinning
        continue-on-error: true
        env:
          PYTHONPATH: independent-store-operations/validation/g2_security
        run: |
          set -o pipefail
          python independent-store-operations/validation/g2_security/test_scrapy_connection_pinning.py 2>&1 | tee independent-store-operations/validation/real_network/results/g2_scrapy_pinning.txt

      - name: Prove Chromium connection-time DNS pinning
        continue-on-error: true
        env:
          PYTHONPATH: independent-store-operations/validation/g2_security
        run: |
          set -o pipefail
          python independent-store-operations/validation/g2_security/test_browser_connection_pinning.py 2>&1 | tee independent-store-operations/validation/real_network/results/g2_browser_pinning.txt

      - name: Enforce G2 connection pinning gate
        run: |
          grep -q 'PASS_G2_SCRAPY_CONNECTION_PINNING' independent-store-operations/validation/real_network/results/g2_scrapy_pinning.txt
          grep -q 'PASS_G2_BROWSER_CONNECTION_PINNING' independent-store-operations/validation/real_network/results/g2_browser_pinning.txt

      - name: Run bounded Scrapy crawl
        run: |
          python independent-store-operations/validation/real_network/crawl_gold.py

      - name: Run browser fallback for incomplete targets
        run: |
          python independent-store-operations/validation/real_network/browser_fallback.py

      - name: Run real-network fact-to-rule E2E
        run: |
          python independent-store-operations/validation/real_network/real_rule_e2e.py

      - name: Show calibration reports
        if: always()
        run: |
          echo '--- G2 Scrapy pinning ---'
          cat independent-store-operations/validation/real_network/results/g2_scrapy_pinning.txt || true
          echo '--- G2 Browser pinning ---'
          cat independent-store-operations/validation/real_network/results/g2_browser_pinning.txt || true
          echo '--- Scrapy report ---'
          cat independent-store-operations/validation/real_network/results/report.json || true
          echo '--- Combined report ---'
          cat independent-store-operations/validation/real_network/results/combined_report.json || true
          echo '--- Rule E2E report ---'
          cat independent-store-operations/validation/real_network/results/rule_e2e_report.json || true

      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-store-ops-real-crawl
          path: independent-store-operations/validation/real_network/results/
          if-no-files-found: warn
          retention-days: 14
