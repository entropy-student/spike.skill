name: PocketBay TalkCraft Strict Render

on:
  push:
    branches:
      - workbench/pocketbay-talkcraft-strict-20260911
    paths:
      - 'workbench/pocketbay-talkcraft-strict/**'
      - '.github/workflows/pocketbay-talkcraft-strict.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/pocketbay-talkcraft-strict-20260911

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick python3-pip fonts-noto-cjk

      - name: Fetch current upstream TalkCraft
        run: git clone --depth 1 https://github.com/Vincentwei1021/video-talkcraft.git _video-talkcraft

      - name: Install Node dependencies
        working-directory: workbench/pocketbay-talkcraft-strict
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: workbench/pocketbay-talkcraft-strict
        run: npx playwright install --with-deps chromium

      - name: Capture live PocketBay evidence assets
        working-directory: workbench/pocketbay-talkcraft-strict
        run: npm run capture

      - name: Build real-page media derivatives
        working-directory: workbench/pocketbay-talkcraft-strict
        run: |
          set -euxo pipefail
          mkdir -p public/pages public/stills out
          convert public/stills/home-deploy.png -resize 620x /tmp/a.png
          convert public/stills/home-discover.png -resize 620x /tmp/b.png
          convert public/stills/home-creator.png -resize 620x /tmp/c.png
          convert public/stills/home-earn.png -resize 620x /tmp/d.png
          convert /tmp/a.png /tmp/b.png /tmp/c.png /tmp/d.png -append /tmp/home-stack.png
          convert /tmp/home-stack.png -gravity north -background white -extent 620x1162 public/pages/home-scroll.png
          convert public/pages/discover-full.png -resize 620x -gravity north -background white -extent 620x1162 public/pages/discover-scroll.png
          ffmpeg -y -loop 1 -i public/pages/deploy-full.png -vf "scale=576:540:force_original_aspect_ratio=increase,crop=576:540,fps=30" -t 12 -c:v libx264 -pix_fmt yuv420p public/stills/deploy-loop.mp4
          test -s public/pages/home-scroll.png
          test -s public/pages/discover-scroll.png
          test -s public/stills/deploy-loop.mp4
          test -s public/stills/pocketbay-logo.png
          test -s public/stills/app-auto-ledger.png
          test -s public/stills/app-rednote-copy.png
          test -s public/stills/app-color-type.png

      - name: Copy current upstream global system and Recipe TSX files
        working-directory: workbench/pocketbay-talkcraft-strict
        run: |
          mkdir -p src/motion-systems
          cp ../../_video-talkcraft/template/motion-systems/backdrop.tsx src/motion-systems/backdrop.tsx
          cp ../../_video-talkcraft/template/motion-systems/camera.tsx src/motion-systems/camera.tsx
          npm run prepare

      - name: Install TalkCraft QA Python dependencies
        run: python3 -m pip install --break-system-packages numpy imageio

      - name: Gate 1 - upstream asset preflight
        working-directory: workbench/pocketbay-talkcraft-strict
        run: python3 ../../_video-talkcraft/scripts/preflight.py --shotbook SHOTBOOK.md --fps 30

      - name: Gate 2 - upstream Recipe fidelity lint
        working-directory: workbench/pocketbay-talkcraft-strict
        run: >-
          python3 ../../_video-talkcraft/scripts/card_lint.py src
          slab-punch-title,source-converge,word-slot-cycle,title-demote-to-label,evidence-scroll-tour,split-60-40-story,strike-and-replace,step-timeline-vertical,gallery-wall-dolly,lead-word-zoom-assemble,line-carry-transition,caret-wipe-transition,pullback-cool-transition

      - name: Gate 2b - S01 beat alignment against uploaded SRT timing
        working-directory: workbench/pocketbay-talkcraft-strict
        run: >-
          python3 ../../_video-talkcraft/scripts/beat_lint.py beats-s01.json audio/timestamps-s01.json
          --shots shots.json --tail 0.5

      - name: Gate 2c - S01 empty-stage advisory
        working-directory: workbench/pocketbay-talkcraft-strict
        run: >-
          python3 ../../_video-talkcraft/scripts/beat_gap_check.py beats-s01.json shots-s01.json
          --gap 2.0 --ok s01

      - name: Compile and render QA still
        working-directory: workbench/pocketbay-talkcraft-strict
        run: npm run still

      - name: Mandatory first-shot preview - visual segment only
        working-directory: workbench/pocketbay-talkcraft-strict
        run: >-
          node ../../_video-talkcraft/scripts/render_shots.mjs
          --shots shots.json --entry src/index.ts --comp PocketBayStrict
          --only s01 --parallel 1 --seg-dir out/segments --crf 18

      - name: Gate 3a - S01 motion health
        working-directory: workbench/pocketbay-talkcraft-strict
        run: >-
          python3 ../../_video-talkcraft/scripts/motion_check.py out/segments/s01.mp4
          0.8 0.003 --anchors beats-s01.json

      - name: Write first-shot build audit
        working-directory: workbench/pocketbay-talkcraft-strict
        run: |
          cat > out/STRICT_S01_AUDIT.md <<'EOF'
          # PocketBay TalkCraft Strict S01 Audit

          - Upstream: Vincentwei1021/video-talkcraft cloned fresh during this run.
          - Mandatory cadence gate: this run renders S01 only; it intentionally does NOT render the full master.
          - Timing source: uploaded SRT cue boundaries; S01 word/token timing file is derived from that source and beat_lint must pass.
          - Real page: PocketBay live homepage captured with Playwright during this run; no code-mocked webpage is used.
          - Global motion: current upstream G1 CameraRig is copied fresh and wraps S01 with one continuous 1.00→1.06 scale path, no x/y/rotation/blur and no impulses.
          - Recipe: slab-punch-title and line-carry-transition are copied from upstream template/cards; core motion laws remain unchanged.
          - S01 semantic timing: copied slab Recipe is offset so its fixed punch lands on the verified “一句话部署” beat; the line-carry title entry is derived from the verified “比部署大得多” beat.
          - Machine gates before artifact upload: preflight.py, card_lint.py, beat_lint.py, beat_gap_check.py advisory, QA still, upstream render_shots.mjs frame assertions, motion_check.py.
          - Audio: user audio remains private to the ChatGPT session, so CI uploads the visual S01 segment only. ChatGPT muxes 0–11.25s of the uploaded MP3 locally to create the mandatory audible preview.
          - Next mandatory user gate: after viewing audible S01, user chooses full-film render or shot-by-shot render cadence.
          EOF

      - name: Upload strict S01 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbay-talkcraft-strict-s01
          path: |
            workbench/pocketbay-talkcraft-strict/out/segments/s01.mp4
            workbench/pocketbay-talkcraft-strict/out/check.png
            workbench/pocketbay-talkcraft-strict/out/STRICT_S01_AUDIT.md
            workbench/pocketbay-talkcraft-strict/sources.md
            workbench/pocketbay-talkcraft-strict/SHOTBOOK.md
            workbench/pocketbay-talkcraft-strict/beats-s01.json
            workbench/pocketbay-talkcraft-strict/shots.json
          retention-days: 7
