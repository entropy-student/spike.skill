slug: meme-music-router
display_name: Meme Music Router（热梗音乐路由器）
version: 0.4.0
status: calibrating
language:
  - zh-CN
  - en
purpose: Find strong memes through live upstream judgment, lock the meme core, then choose the funniest presentation form—image, dialogue, song, short video, or mixed—to amplify the meme without replacing its theme.
role: meme_first_creative_orchestrator
runtime:
  live_skill_invocation_required: true
  rules: references/LIVE_SKILL_INVOCATION_RULES.md
  source_of_truth: current_github_default_branch
  allow_memory_or_cached_summary_as_substitute: false
  refetch_before_each_actual_skill_use: true
  refetch_required_references: true
  on_live_read_failure: LIVE_SKILL_READ_FAILED
upstream_skills:
  hotspot: entertainment-rander
  music_trend: music-trend-radar
  music_quality: music-quality-radar
upstream_results_are_authoritative: true
meme_first:
  rules: references/MEME_AMPLIFICATION_RULES.md
  meme_core_lock_required: true
  parent_child_separation_required: true
  format_serves_meme: true
  music_is_optional: true
  music_role: amplifier
  theme_drift_forbidden: true
router_scope:
  stores_upstream_domain_definitions: false
  responsibilities:
    - invoke the right upstream skill at the right step
    - lock the source meme and selected derivative before creation
    - preserve parent meme versus child unit boundaries
    - choose the presentation form that best amplifies the meme
    - manage confirmation and downstream handoffs
    - prevent theme drift across image, dialogue, music and video
    - assemble final deliverables
selection:
  entertainment_gate_from_upstream_result:
    - S+
    - S
  presentation_forms:
    - image
    - dialogue
    - song
    - short_video
    - mixed
  song_types:
    - original
    - adaptation
  creative_output_tiers:
    - S+
    - S
    - A+
output_language_policy:
  rules: references/LANGUAGE_FLEXIBILITY_RULES.md
  fixed_chinese_only: false
  language_flexibility: true
  allow_bilingual_or_mixed_language: true
  allow_dialect_or_other_language_when_effective: true
  optimize_for_meme_effect_over_default_language: true
post_confirmation:
  meme_image:
    reference_rules: references/IMAGE_REFERENCE_RULES.md
    amplification_rules: references/MEME_AMPLIFICATION_RULES.md
    language_rules: references/LANGUAGE_FLEXIBILITY_RULES.md
    reference_first: true
    preserve_source_meme: true
    preserve_selected_derivative: true
    prompt_chars:
      recommended: 80-160
      max: 200
    avoid_freeform_character_redesign: true
  music_output:
    rules: references/MUSIC_OUTPUT_RULES.md
    amplification_rules: references/MEME_AMPLIFICATION_RULES.md
    language_rules: references/LANGUAGE_FLEXIBILITY_RULES.md
    only_when_song_is_selected: true
    live_quality_skill_read_required: true
    theme_lock_required: true
    required_meme_anchor_in_hook: true
    style_prompt:
      preferred_chars: 200-350
      max_chars: 500
      concise_first: true
    lyrics:
      require_section_labels: true
quality_gates:
  meme_recognition_test: true
  meme_binding_test: true
  amplification_test: true
handoff:
  music_prompt_generator:
    status: CALIBRATING
    required_input: music_meme_lock
