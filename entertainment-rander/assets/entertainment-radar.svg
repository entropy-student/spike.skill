<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Entertainment Rander 娱乐热梗雷达</title>
  <desc id="desc">S+ S A B 中文互联网娱乐热梗评级海报</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset=".55" stop-color="#24143d"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#ff4d8d"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="sp" x1="0" x2="1"><stop stop-color="#ff6b9d"/><stop offset="1" stop-color="#ffd1e1"/></linearGradient>
    <linearGradient id="s" x1="0" x2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ffe0a3"/></linearGradient>
    <linearGradient id="a" x1="0" x2="1"><stop stop-color="#56a8ff"/><stop offset="1" stop-color="#b8dcff"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1"><stop stop-color="#75d67b"/><stop offset="1" stop-color="#c8f7cb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="1600" rx="42" fill="url(#bg)"/>
  <g opacity=".7" fill="#fff"><circle cx="92" cy="90" r="4"/><circle cx="1080" cy="140" r="6"/><circle cx="1020" cy="380" r="3"/><circle cx="120" cy="510" r="5"/><circle cx="1110" cy="790" r="4"/><circle cx="70" cy="1240" r="3"/></g>

  <text x="70" y="98" fill="#fff" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">好玩的，才是正经事。</text>
  <text x="1130" y="98" fill="#ffd166" font-size="26" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">GOOD MEMES · BETTER INTERNET</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="1090" height="230" rx="44" fill="#fff"/>
    <text x="600" y="245" fill="#111827" font-size="92" font-family="Arial Black, PingFang SC, Microsoft YaHei, sans-serif" font-weight="900" text-anchor="middle">娱乐热梗<tspan fill="#ff3f85">雷达</tspan></text>
    <rect x="260" y="275" width="680" height="56" rx="28" fill="url(#hero)"/>
    <text x="600" y="314" fill="#fff" font-size="29" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" text-anchor="middle">ENTERTAINMENT RANDER · 中文互联网热梗筛选 Skill</text>
  </g>

  <text x="600" y="425" fill="#f8fafc" font-size="34" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">不是看谁上热搜，而是找出真正 <tspan fill="#ffd166" font-weight="800">能长、能玩、能继续编</tspan> 的梗。</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="60" y="475" width="1080" height="148" rx="32" fill="#ffffff" opacity=".96"/>
    <text x="100" y="522" font-size="24" font-weight="800" fill="#111827">八个判断维度</text>
    <g font-size="22" fill="#334155" text-anchor="middle">
      <text x="170" y="575">🔥 热度</text><text x="300" y="575">🌐 破圈</text><text x="430" y="575">⏱ 持续</text><text x="560" y="575">🚀 二创</text>
      <text x="690" y="575">🌱 脱源</text><text x="820" y="575">🧬 衍生</text><text x="950" y="575">💎 创意</text><text x="1070" y="575">✨ 网感</text>
    </g>
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" filter="url(#shadow)">
    <rect x="60" y="665" width="1080" height="185" rx="32" fill="url(#sp)"/>
    <text x="110" y="750" font-size="86" font-weight="900" fill="#111827">S+</text>
    <text x="255" y="722" font-size="34" font-weight="900" fill="#111827">互联网梗母版</text>
    <text x="255" y="770" font-size="25" fill="#3f2330">已经成为文化资产，能反复复用、解释和创造后来的新梗</text>
    <text x="1085" y="753" font-size="27" font-weight="800" fill="#5b1730" text-anchor="end">大家拿它创造下一代梗 →</text>

    <rect x="60" y="875" width="1080" height="185" rx="32" fill="url(#s)"/>
    <text x="110" y="960" font-size="86" font-weight="900" fill="#111827">S</text>
    <text x="255" y="932" font-size="34" font-weight="900" fill="#111827">持续生长的内容宇宙</text>
    <text x="255" y="980" font-size="25" fill="#513916">有子梗、有新解释、有新人物、有新玩法，不只是在复读</text>
    <text x="1085" y="963" font-size="27" font-weight="800" fill="#6b4100" text-anchor="end">大家会继续往下编 →</text>

    <rect x="60" y="1085" width="1080" height="185" rx="32" fill="url(#a)"/>
    <text x="110" y="1170" font-size="86" font-weight="900" fill="#111827">A</text>
    <text x="255" y="1142" font-size="34" font-weight="900" fill="#111827">极热好玩 · 全民模仿</text>
    <text x="255" y="1190" font-size="25" fill="#123d65">跟跳、跟唱、改词、拍同款很强，但复制明显多于创造</text>
    <text x="1085" y="1173" font-size="27" font-weight="800" fill="#153c67" text-anchor="end">大家会拍自己的版本 →</text>

    <rect x="60" y="1295" width="1080" height="185" rx="32" fill="url(#b)"/>
    <text x="110" y="1380" font-size="86" font-weight="900" fill="#111827">B</text>
    <text x="255" y="1352" font-size="34" font-weight="900" fill="#111827">流行爆款 · 口头禅</text>
    <text x="255" y="1400" font-size="25" fill="#194c22">大家都知道，也经常说，但很少继续长出新的内容结构</text>
    <text x="1085" y="1383" font-size="27" font-weight="800" fill="#1f5a28" text-anchor="end">大家会说它 →</text>
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="75" y="1530" fill="#fff" font-size="28" font-weight="800">⚡ 快速判断：复制 ≠ 创造 · 热度 ≠ 等级 · 真正的 S 会自己长出新东西</text>
    <text x="1125" y="1530" fill="#ffd166" font-size="24" text-anchor="end">spike.skill / entertainment-rander</text>
  </g>
</svg>
